<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Event</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Create New Event</h1>
        </header>
        
        <!-- FIXED: Added id="eventForm" -->
        <form id="eventForm">
            <div class="form-group">
                <label for="title">Event Title:</label>
                <input type="text" id="title" name="title" placeholder="Enter event title" required>
            </div>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="time">Time:</label>
                <input type="time" id="time" name="time" required>
            </div>
            <div class="form-group">
                <label for="flex">Event Flex (Image):</label>
                <input type="file" id="flex" name="flex" accept="image/*">
            </div>
            <div class="form-group">
                <label for="link">Registration Link:</label>
                <input type="url" id="link" name="link" placeholder="Enter registration link" required>
            </div>
            <button type="submit" class="submit-btn">Create Event</button>
        </form>
           <div class="button">
        <a href="start.html">
            <button type="button">EXIT</button>
        </a>
    </div>
    </div>
 
    <script type="module" src="admin.js"></script>
</body>
</html>
